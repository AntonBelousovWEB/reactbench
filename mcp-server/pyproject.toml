[project]
name = "reactbench-mcp"
version = "0.3.0"
description = "MCP server for ReactBench"
requires-python = ">=3.13"
dependencies = ["mcp>=2.0.0,<2.1", "pydantic>=2.0,<2.13", "pydantic-core>=2.41.0,<2.42.0", "anyio>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

license = { text = "MIT" }

[project.scripts]
reactbench-mcp = "reactbench_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reactbench_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
